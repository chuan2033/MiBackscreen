name: Android Debug Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # miuix 以子模块 + includeBuild 引入（third_party/miuix），默认不拉子模块会报
          # 「Project with path ':miuix-core' not found in build ':miuix'」。
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 该 action 默认 packages 为 `tools platform-tools`，但 Google 已从 SDK 仓库
          # 移除旧的 tools 包，sdkmanager 会以 exit 1 失败。这里只装 platform-tools；
          # platforms/build-tools 由 Gradle 按 compileSdk 自动拉取。
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

  ksu-module:
    # 附加资源模块的脚本在设备上由 busybox ash 执行：语法错误、CRLF、BOM 都会让模块直接失效。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install busybox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox

      - name: Syntax check (dash + busybox ash)
        run: |
          status=0
          for f in $(git ls-files 'ksu-module/*.sh'); do
            sh -n "$f" || status=1
            busybox sh -n "$f" || status=1
          done
          exit $status

      - name: ShellCheck (errors only)
        run: shellcheck -s sh -S error $(git ls-files 'ksu-module/*.sh')

      - name: No CRLF or BOM in module files
        run: |
          bad=$(git ls-files ksu-module/packaging | while read -r f; do
            if grep -qU $'\r' "$f" || head -c3 "$f" | grep -q $'\xef\xbb\xbf'; then echo "$f"; fi
          done)
          if [ -n "$bad" ]; then echo "CRLF/BOM found:"; echo "$bad"; exit 1; fi
