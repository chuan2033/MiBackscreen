pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        mavenCentral()
        maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        mavenCentral()
        maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
        // SuperLyricApi（背屏实时歌词订阅）只发布在 JitPack；限定分组，其余依赖不走这个仓库。
        maven {
            url = 'https://jitpack.io'
            content { includeGroup 'com.github.HChenX' }
        }
    }
}

rootProject.name = "MiBackscreen"
include(":app")

includeBuild("third_party/miuix") {
    dependencySubstitution {
        ["core", "ui", "preference", "material", "blur", "glass", "glass-icons", "squircle", "icons", "nav"].each { name ->
            substitute(module("top.yukonga.miuix.kmp:miuix-${name}-android"))
                    .using(project(":miuix-${name}"))
        }
    }
}
