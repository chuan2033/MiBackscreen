plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.isFile()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def signingValue = { String key -> localProps[key] ?: System.getenv(key) }
def releaseKeystoreFile = file(signingValue('RELEASE_STORE_FILE') ?: 'release-key.jks')
def hasReleaseSigning = releaseKeystoreFile.isFile()
        && signingValue('RELEASE_STORE_PASSWORD')
        && signingValue('RELEASE_KEY_PASSWORD')
if (signingValue('RELEASE_STORE_FILE') && !hasReleaseSigning) {
    throw new GradleException('Configured signing key is unavailable or missing RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD')
}

kotlin {
    jvmToolchain(21)
}

android {
    namespace 'hook.HyperBackscreen'
    compileSdk 37
    buildToolsVersion = "37.0.0"

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword signingValue('RELEASE_STORE_PASSWORD')
                keyAlias signingValue('RELEASE_KEY_ALIAS') ?: 'hyperbackscreen'
                keyPassword signingValue('RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "hook.HyperBackscreen"
        minSdk 36
        targetSdk 36
        versionCode 11
        versionName "1.2.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    packaging {
        resources {
            merges += ["META-INF/xposed/*"]
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-nav-android:0.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation files('libs/interface-102.0.0.jar', 'libs/service-102.0.0.jar')
    testImplementation 'junit:junit:4.13.2'
}
