plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.isFile()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def signingValue = { String key -> localProps[key] ?: System.getenv(key) }
def releaseKeystoreFile = file(signingValue('RELEASE_STORE_FILE') ?: 'release-key.jks')
def hasReleaseSigning = releaseKeystoreFile.isFile()
        && signingValue('RELEASE_STORE_PASSWORD')
        && signingValue('RELEASE_KEY_PASSWORD')
if (signingValue('RELEASE_STORE_FILE') && !hasReleaseSigning) {
    throw new GradleException('Configured signing key is unavailable or missing RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD')
}

// Modern Xposed（libxposed）API 版本的单一来源：依赖坐标、libs/ 下两个 jar 的文件名都由
// 这里派生；META-INF/xposed/module.prop 的 targetApiVersion 与 jar 是否存在在构建时校验，
// 对不上直接终止。升版本只改这一个值，再换上同名的新 jar。
def libxposedApiVersion = '102.0.0'
def libxposedApiMajor = libxposedApiVersion.tokenize('.')[0]
def xposedModulePropFile = file('src/main/resources/META-INF/xposed/module.prop')
def xposedModuleProps = new Properties()
xposedModulePropFile.withReader('UTF-8') { xposedModuleProps.load(it) }
if (xposedModuleProps.getProperty('targetApiVersion') != libxposedApiMajor) {
    throw new GradleException("META-INF/xposed/module.prop targetApiVersion=" +
            "${xposedModuleProps.getProperty('targetApiVersion')} " +
            "does not match libxposedApiVersion=${libxposedApiVersion}")
}
['interface', 'service'].each { name ->
    def jar = file("libs/${name}-${libxposedApiVersion}.jar")
    if (!jar.isFile()) {
        throw new GradleException("Missing libxposed jar: ${jar}")
    }
}

kotlin {
    jvmToolchain(21)
}

android {
    namespace 'hook.HyperBackscreen'
    compileSdk 37
    buildToolsVersion = "37.0.0"

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword signingValue('RELEASE_STORE_PASSWORD')
                keyAlias signingValue('RELEASE_KEY_ALIAS') ?: 'hyperbackscreen'
                keyPassword signingValue('RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "hook.HyperBackscreen"
        minSdk 36
        targetSdk 36
        versionCode 17
        versionName "1.3.0"
        // DexKit 只在 arm64 真机上跑，x86_64 只服务模拟器，整包体积省一半。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    lint {
        // AGP 9.5 起新增的跨方法线程推断（ThreadConstraint）会把 Hook 回调里的离屏绘制、
        // 写盘等调用报成「无法满足的线程要求」：这些回调跑在哪个线程由宿主决定，lint 推断不了。
        // 降为警告，仍出现在报告里，但不让构建失败。
        warning 'ThreadConstraint'
    }

    testOptions {
        unitTests.all {
            // 宿主 dex 分析工具用，正常运行测试时为空，相关用例自动跳过。
            systemProperty 'host.apk.dir', System.getProperty('host.apk.dir') ?: System.getenv('HOST_APK_DIR') ?: ''
        }
    }

    packaging {
        resources {
            merges += ["META-INF/xposed/*"]
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    // miuix 全部模块由 settings.gradle 的 includeBuild 替换成子模块 third_party/miuix 的源码，
    // 下面这些坐标里的版本号不起作用，只用来标注子模块当前所在的提交。更新子模块时把这里的 2f7052e 一起改掉。
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4-2f7052e-SNAPSHOT'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4-2f7052e-SNAPSHOT'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4-2f7052e-SNAPSHOT'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4-2f7052e-SNAPSHOT'
    implementation 'top.yukonga.miuix.kmp:miuix-nav-android:0.9.4-2f7052e-SNAPSHOT'
    implementation 'top.yukonga.miuix.kmp:miuix-glass-android:0.9.4-2f7052e-SNAPSHOT'
    implementation 'top.yukonga.miuix.kmp:miuix-glass-icons-android:0.9.4-2f7052e-SNAPSHOT'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    compileOnly "io.github.libxposed:api:${libxposedApiVersion}"
    implementation files("libs/interface-${libxposedApiVersion}.jar", "libs/service-${libxposedApiVersion}.jar")
    // 按结构定位宿主混淆成员，替代硬编码混淆名。
    implementation 'org.luckypray:dexkit:2.2.0'
    // 背屏实时歌词：SuperLyric 3.x（super_lyric）与 4.x（super_lyric.v4）两套 AIDL 都在这个包里，LGPL。
    implementation 'com.github.HChenX:SuperLyricApi:4.0'
    testImplementation 'org.luckypray:dexkit:2.2.0'
    testImplementation 'junit:junit:4.13.2'
}
