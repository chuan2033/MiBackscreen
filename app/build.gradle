plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.isFile()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def releaseKeystoreFile = file('release-key.jks')
def hasReleaseSigning = releaseKeystoreFile.isFile()
        && localProps['RELEASE_STORE_PASSWORD']
        && localProps['RELEASE_KEY_PASSWORD']

kotlin {
    jvmToolchain(21)
}

android {
    namespace 'hook.HyperBackscreen'
    compileSdk 37
    buildToolsVersion = "37.0.0"

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword localProps['RELEASE_STORE_PASSWORD']
                keyAlias 'hyperbackscreen'
                keyPassword localProps['RELEASE_KEY_PASSWORD']
            }
        }
    }

    defaultConfig {
        applicationId "hook.HyperBackscreen"
        minSdk 35
        targetSdk 35
        versionCode 5
        versionName "1.1.3"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    packaging {
        resources {
            merges += ["META-INF/xposed/*"]
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.3'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation files('libs/interface-102.0.0.jar', 'libs/service-102.0.0.jar')
    testImplementation 'junit:junit:4.13.2'
}
